<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiFa Trainer – Kontoaktion</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; background: #f6f2ff; color: #2d1f46; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #f6f2ff; }
    .card { width: min(100%, 480px); padding: clamp(24px, 6vw, 40px); border: 1px solid rgba(79,159,104,.18); border-radius: 22px; background: #fff; box-shadow: 0 16px 38px rgba(31,52,39,.18); }
    .brand { margin: 0 0 8px; color: #245c3a; font-size: clamp(30px, 8vw, 44px); letter-spacing: -.03em; }
    h1 { margin: 0 0 22px; color: #2d1f46; font-size: clamp(22px, 5vw, 30px); }
    .status { margin: 0 0 20px; padding: 14px; border-radius: 14px; background: #fff0f0; color: #8f2828; line-height: 1.5; }
    .status.success { background: #e8f7ed; color: #245c3a; }
    form[hidden], .status[hidden], a[hidden] { display: none; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #c9bddf; border-radius: 12px; color: #2d1f46; font: inherit; }
    button, a { display: inline-block; width: 100%; margin-top: 18px; padding: 12px 16px; border: 0; border-radius: 14px; background: #4f9f68; color: #fff; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { background: #3f8555; }
    .hint { margin: 0; color: #625b70; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="actionTitle">
    <p class="brand">WiFa Trainer</p>
    <h1 id="actionTitle">Kontoaktion</h1>
    <p id="actionStatus" class="status" role="status" aria-live="polite">Die Aktion wird geprüft …</p>
    <form id="resetPasswordForm" hidden>
      <label for="newPassword">Neues Passwort</label>
      <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>
      <label for="confirmPassword">Passwort bestätigen</label>
      <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>
      <button type="submit">Passwort speichern</button>
    </form>
    <a id="homeLink" href="https://wifa-trainer.de/" hidden>Zurück zum WiFa Trainer</a>
    <a id="loginLink" href="https://wifa-trainer.de/#auth" hidden>Zurück zum Login</a>
  </main>
  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { applyActionCode, verifyPasswordResetCode, confirmPasswordReset } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
    import { initAuthAction } from './js/auth-action.js';
    initAuthAction({ auth, applyActionCode, verifyPasswordResetCode, confirmPasswordReset });
  </script>
</body>
</html>
